<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王泽然的任务清单</title>
    <style>
        * {
           
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
        }
        body {
            background: linear-gradient(to right, #c3c556, #74b45a);
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .box {
            background-color: #f2f6f1;
            max-width: 500px;
            width:90%;
            margin: 50px auto;
            padding:2rem;
            border-radius: 10px;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.6);
   
        }
        h1 { 
            text-align: center;
            color: #1c0b8d;
            margin-bottom: 1rem;
        }
        .takeinput {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
           
        }
        #input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #6556d4;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
            transition:
            border-color 0.3s ease,
            box-shadow 0.3s ease;
        }
        #add {
            padding: 0.5rem;
            color:black;
            background-color: #c7430b;
            cursor: pointer;
            transition: 
            background-color 0.3s ease,
            transform 0.3s ease;
            border-radius: 5px;
            border: none;

        }
        #input:focus {
            border-color: #000a0545;
            box-shadow: 1px 0 5px rgba(0, 0, 0, 0.2);
        }
        #add:hover {
            background-color: #10d7f1;
        }
        #add:active {
            transform: scale(0.9);
        }
        .state {
            display: flex;
            margin-bottom: 2rem;
            gap: 0.5rem;
        }
        .state>button {
            flex: 1;
            padding: 0.5rem;
            background-color: #ebe00e;
            cursor: pointer;
            color: black;
            border: none;
            
            border-radius: 5px;
            transition:background-color 0.3s ease, 
                       transform 0.3s ease,
                       color 0.3s ease;            
        }
        .state>button:hover {
            background-color: #10d7f1;
        }
        .state>button.active {
            transform: translateY(2px);
            background-color: #dfdadf;
            color: rgb(230, 22, 22);

        }
        
        #tasklist {
            list-style:none;
            padding:1rem;
            margin-bottom: 2rem;

        }
        #tasklist>li {
            background-color: antiquewhite;
            padding:1rem;
            margin-bottom: 0.5rem;
            border-radius: 0 4px 4px 0;
            border-left:4px solid black;
            display: flex;
            justify-content:space-between;
            /* 这里的主要作用就是左右各位于起点终点，间距的把控看的是gap和flex：1还有padding */
            align-items:center;
            gap:0.5rem;
          



        }
        .task-text {
            flex:1;
            
            overflow-wrap: anywhere;
            /* 但是如果没有flex-shrink的话，只会说将整行尽可能除了按钮的部分占满后才会换行，
            就还是会压缩按钮大小， */
        }
        .task-actions {
            display:flex;
            gap:0.5rem;
           
        }
        .toggle,
        .delete {
            border:none;
            padding:0.8rem;
            border-radius:8px;
            cursor: pointer;
            color:#ebe00e;
            background-color: rgb(253, 250, 250);
            transition: transform 0.3s ease,
                        background-color 0.2s ease;



        }
        .toggle:hover,
        .delete:hover {
            transform:translateY(2px);
            background-color: #74b45a;

        }
        .toggle:active,
        .delete:active {
            transform:scale(0.9);
        }
        #tasklist>li.completed {
           border-left:4px solid rgb(51, 9, 240);
           background-color: #c5dcbf;
        }
        .completed>.task-text {
            text-decoration:line-through;
            color:#6556d4;
        }
        #notice {
            text-align: center;
            font-size: 1rem;
            color:#da74da;
            border-top: 4px solid black;
            padding:1.5rem;


        }
        @media (max-width:600px) {
            .box {
                margin-top:20px;
                padding:1rem;
            }

            #tasklist {
                margin-bottom:0.5rem;
                padding:0.5rem;
            }

            
            
        }
        @media (hover: hover) and (pointer: fine) {
                .state > button:hover {
                background-color: #10d7f1;
                }
        }
      


    </style>
</head>

<body>
    <div class="box">
        <h1>王泽然的任务清单</h1>
        <div class="takeinput">
            <input type="text" id="input" placeholder="请输入任务">
            <button id="add">添加</button>
        </div>
        <div class="state">
            <button id="clear">全部</button>
            <button id="clearDone">已完成</button>
            <button id="clearUndone">未完成</button>
        </div>
        
        <ul id="tasklist">
            
        </ul>
        
        <div id="notice">
                
        </div>
    <script>
        const tasks=[];

        const taskinput=document.getElementById("input");
        const addbutton=document.getElementById("add");
        const taskList=document.getElementById("tasklist");
        const allbutton=document.getElementById("clear");
        const completedbutton=document.getElementById("clearDone");
        const uncompletedbutton=document.getElementById("clearUndone");
        const notice=document.getElementById("notice");

        // 保存数据，在每次发生变化时引用函数
        function saveTasks(tasksArray) {
            localStorage.setItem("tasks",JSON.stringify(tasks))
        }


        function noticelist() {
            const taskcount=tasks.length;
         const donecount=tasks.filter(function(item) {
            return item.completed;
         }).length;
         const undonecount=taskcount-donecount;
         notice.textContent=`共${taskcount}个任务,已完成${donecount}个任务,未完成${undonecount}个任务`
        }
        
        // 创建函数，此刻不只有添加按钮监听到了才能添加页面元素，我
        // 刷新前保存的数据在刷新后只要调用这个函数也可以重新渲染页面
        function createTaskElement(task) {
            const li=document.createElement("li");
            // 遵循的逻辑是先给所有的任务设置默认未完成，所以不加completed标签，
            // 后面监听到对应事件才加
            const span=document.createElement("span");
            span.classList.add("task-text");
            span.textContent=task.text;
            li.appendChild(span);
        
            const div=document.createElement("div");
            div.classList.add("task-actions");
            const toggle=document.createElement("button");
            toggle.classList.add("toggle");
            if(task.completed===true)
            {
                toggle.textContent="已完成";
                li.classList.add("completed");
            }else {
                toggle.textContent="未完成";
            }
            const deletebutton=document.createElement("button");
            deletebutton.classList.add("delete");
            deletebutton.textContent="删除";
            div.appendChild(toggle);
            div.appendChild(deletebutton);

            li.appendChild(div);
            taskList.appendChild(li);
        
       
       
        toggle.addEventListener("click",function() {
            li.classList.toggle("completed");
            task.completed=!task.completed;
            if(task.completed)
         {
            toggle.textContent="已完成";

         }else {
            toggle.textContent="未完成";
         }
         saveTasks(tasks);

         noticelist();
         applyfilter();
        //  切换任务状态时，由于已经在比如筛选状态为completed情况下切换，为了防止
        // 切换成未完成后，仍在已完成里显示，所以要重新渲染，识别出这个新切换的未完成任务并
        // 将他隐藏起来
         })  

         deletebutton.addEventListener("click",function() {
            li.remove();
            //这里是删除函数的回调函数也就是li.remove记住了li，也就是deletebutton调用了他，所以
            // 相当于绑定了deletebutton和li还有对应task
            const taskindex=tasks.findIndex(function(item) {
                return item.id===task.id;

            })
            if(taskindex!==-1)
            {
                tasks.splice(taskindex,1);
            }
            noticelist();
            applyfilter();
            saveTasks(tasks);

         })
        }

        addbutton.addEventListener("click",function () {
        const textcontent=taskinput.value.trim();

        if (textcontent==="")
        {
                alert("请输入内容");
                return;
        }

        const task={
            id:Date.now(),
            text:textcontent,
            completed:false
            }
        tasks.push(task);
        saveTasks(tasks);
        noticelist();
        createTaskElement(task);
        applyfilter();
         // 这里相当于重新遍历了所有内容，并且处于当前筛选状态下比如currentFilter="completed"时
        // 这里新添加的任务就会由于没有completed类而被隐藏起来，所以在这添加该函数就是在重新渲染
        taskinput.value="";
        //  最后清空输入框作用是当输入后的代码出现错误后，可以及时截住无法继续运行，最后就是
        // 输入框文字仍存在，无法清除，用户知道出现错误，而非出现错误时仍在运行，并得到一个虽然
        // 输入的任务还在但是其他地方比如按钮出现错误效果，得到一个错误结果
         })
         
         noticelist();
        //  页面第一次刷新要置零

         let currentFilter="none";
        // 这个语句的目的是创建当前点击的筛选按钮状态变量，
        // 同时可以起到首次打开页面默认效果为全部状态 


        //  let变量可以重新赋值，也就是可以变化，但是const不可以，
        // 函数每调用一次，都会创建一个新的函数作用域，里面的 const 变量也是重新创建的变量，
        // 而不是给上一次的变量重新赋值。
        function applyfilter() {
            if(currentFilter==="none") {
                allbutton.classList.remove("active");
                completedbutton.classList.remove("active");
                uncompletedbutton.classList.remove("active");
            }else if(currentFilter==="all")
        {
            allbutton.classList.add("active");
            completedbutton.classList.remove("active");
            uncompletedbutton.classList.remove("active");
        } else if(currentFilter==="completed") {
            completedbutton.classList.add("active");
            allbutton.classList.remove("active");
            uncompletedbutton.classList.remove("active");

        }
        else{
            uncompletedbutton.classList.add("active");
            allbutton.classList.remove("active");
            completedbutton.classList.remove("active");
        }
        // 可以不用创建三个监听，只需创建一个筛选函数，配上对应按钮点击变量，当监听到事件就可以通过
        // currentFilter变量来判断当前点击的按钮是哪个，加上条件语句来实现显示隐藏等效果
        const taskitems=taskList.querySelectorAll("li"); 
        taskitems.forEach(function(items) {
                
                const iscompleted=items.classList.contains("completed");
                if(currentFilter==="all"||currentFilter==="none") {
                    
                    items.style.display="flex";
                    // 再加一个新的状态，为了点击筛选按钮后再次点击同一个按钮可以取消筛选，显示全部任务
                    // 但是这个none状态是一个既能显示全部任务，同时不会让全部按钮变为active状态的状态
                    // 所以我们在上面也对不同状态下的active类进行规定，防止更换状态时active类未被移除

                }
                else if(currentFilter==="completed") {
                    if(iscompleted) {
                        items.style.display="flex";
                    }
                    else {
                        items.style.display="none";
                    }
                }
                else {
                    if(!iscompleted) {
                        items.style.display="flex";
                    }
                    else {
                        items.style.display="none";
                    }
                }

            }) 
        }

        allbutton.addEventListener("click",function() {
            if(currentFilter==="all") {
                currentFilter="none";
                applyfilter();
            }else{
            currentFilter="all";
            applyfilter();
            }
        })
        completedbutton.addEventListener("click",function() {
            if(currentFilter==="completed") {
                currentFilter="none";
                applyfilter();
            }
            // 这里的逻辑是如果当前点击的按钮是已完成按钮，那么就切换为全部按钮，重新渲染页面
            else {
                currentFilter="completed";
                applyfilter();
            }
        })
        uncompletedbutton.addEventListener("click",function() { 
            if(currentFilter==="uncompleted") {
                currentFilter="none";
                applyfilter();
            }
            else {
                currentFilter="uncompleted";

                applyfilter();
        }
        })
        // 其实这也相当于重新渲染页面了，因为每次有点击事件我们都会调用applyfilter函数，
        // 然后重新遍历li，重新判断当前点击的按钮是哪个，重新添加active和判断需要显示隐藏的任务
        // 比如你从已完成换到未完成，他就会监听到点击未完成事件，然后先更换状态，并执行
        // 未完成状态下的函数，此时就会显示未完成状态下的任务，重新对页面进行未完成状态的渲染了，也算是覆盖了已完成的页面吧
        applyfilter();

        // 页面刷新后还会有一次默认的js代码执行，所以写在脚本末尾
        taskmean=localStorage.getItem("tasks");
        if(taskmean!==null)
        {
            taskarr=JSON.parse(taskmean);
        }
    
        // 拿到存储的代码要先判断有无，没有则仍保持空数组
        // 但是你不能重新输入tasks=[],因为const变量是不可以重新赋值的
        taskarr.forEach(function(task) {
            tasks.push(task);
            createTaskElement(task);
            noticelist();
            applyfilter()
        })

         
        taskinput.addEventListener("keydown",function(event){
                if(event.key==="Enter") {
                    addbutton.click();

                }
            })
   
         
         

        

         
        
    </script> 



</div>




</body>
</html>
